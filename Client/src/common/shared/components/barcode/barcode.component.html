<div class="my-barcode input-group">
    <input class="form-control" 
    type="text" 
    name="my-barcode"
    [(ngModel)]="barcode" 
    (keydown)="onKeydown($event)" 
    (keyup)="onKeyup($event)" 
    [placeholder]="placeholder"
    [required]="required"/> 
</div>
