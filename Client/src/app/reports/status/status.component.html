
<div class="container h-100 d-flex flex-column">
    <h3>{{message}}</h3>
    <div class="form-group row mb-2">
        <label class="col-md-4 col-form-label">Item Status</label>
        <div class="col-md-8">
            <select class="form-controlz form-select" [(ngModel)]="status" (ngModelChange)="changeStatus($event)" name="StatusID" required >
                <option *ngFor="let i of statuses" [value]="i.ID">{{i.Name}}</option>
             </select>
        </div>
    </div>
    <div class="flex-grow-1" style="overflow-y: auto;">
        <my-datagrid name="maingrid" [columns]="columns" [data]="items" [Tools]="[]" (rowClicked)="rowClick($event)"></my-datagrid>
    </div>
