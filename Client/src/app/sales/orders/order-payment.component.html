
<div class="row">
    <div class="col-md-12" style="max-height: 300px;overflow-y: auto;">
        <table class="table table-striped table-bordered table-condensed">
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Date</th>
                    <th>Amount</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of payments">
                    <td>{{item.Reason.Name}}</td>
                    <td>{{item.createdAt | date}}</td>
                    <td>{{item.Amount | currency}}</td>
                    <td>
                        <button class="btn btn-xs" (click)="btnClick(item,'delete');" >
                            <fa-icon [icon]="['fas', 'trash-alt']" class="text-danger" size="xs" title="Delete"></fa-icon>
                        </button>
                    </td>
                </tr>
                <tr *ngIf="payments?.length==0">
                    <td colspan="4" style="text-align: center;">No payment transactions yet</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="form-group row mb-2">
            <label class="col-md-4 col-form-label">Type</label>
            <div class="col-md-8">
                <select class="form-controlz form-select" [(ngModel)]="reasonid" name="PaymentReasonID" required >
                    <option *ngFor="let i of reasons" [value]="i.ID">{{i.Name}}</option>
                 </select>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-4 col-form-label">Amount</label>
            <div class="col-md-8">
                                <!-- <input matInput class="form-control" name="Amount" type="text" placeholder="Payment Amount"
                                [ngModel]="amount | currency:'USD':'symbol':'2.2'"
                                [ngModelOptions]="{updateOn:'blur'}" (ngModelChange)="amount=$event" /> -->
                <!-- <input class="form-control" name="price" placeholder="" [(ngModel)]="price" required> -->
                <my-money [money]="amount" (moneyChange)="amountChanged($event)"></my-money>
            </div>
        </div>
        <!-- <div class="btn-group float-end" role="group">
            <button (click)="save()" class="btn btn-link btn-sm">Save</button>
        </div> -->
    </div>
</div>
