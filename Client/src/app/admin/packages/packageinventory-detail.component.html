
<div class="padded"></div>
<div class="container">
    <div class="row">

        <div class="col-md-12">
            <div class="card" *ngIf="item">
                <div class="card-header">
                    <my-backbutton class="float-end" [link]="backto"></my-backbutton>
                    <h3><span>{{id==='add'?"Create":"Update"}} </span>Package Item</h3>
                </div>
                <div class="card-body">

                    <form>
                        <div class="form-group row">
                            <label class="col-md-4 col-form-label">Package Name</label>
                            <div class="col-md-8">
                                <select class="form-controlz form-select" [(ngModel)]="item.PackageID" name="Package" required [disabled]="package_id!=null">
                                    <option *ngFor="let i of packages" [value]="i.ID">{{i.Name}}</option>
                                 </select>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-4 col-form-label">Inventory Model</label>
                            <div class="col-md-8">
                                <select class="form-controlz form-select" [(ngModel)]="item.InventoryID" name="Inventory" required>
                                    <option *ngFor="let i of inventories" [value]="i.ID">{{i.ModelName}} ({{i.InventoryType.Name}})</option>
                                 </select>
                            </div>
                        </div>

                        <div class="form-group row">
                            <div class="offset-sm-4 col-sm-8">
                                <div class="btn-group" role="group">
                                    <button type="button" class="btn btn-success" (click)="add()" *ngIf="id==='add'">Create Package Item</button>
                                    <button type="button" class="btn btn-success" (click)="save()" *ngIf="id!='add'">Update Package Item</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
